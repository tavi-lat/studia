<!doctype html><html lang='ca'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f3eee5'><meta name='apple-mobile-web-app-capable' content='yes'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='styles.css'><title>Studia</title></head><body><header><div><small id='dateLabel'></small><h1>Studia</h1></div><button id='addBtn'>＋</button></header><main><section class='hero'><p>Agenda acadèmica</p><h2 id='summary'>Organitza el teu dia</h2><button id='focusBtn'>Començar focus</button></section><section><div class='title'><h2>Calendari</h2><button id='todayBtn'>Avui</button></div><div class='calendar'><div class='nav'><button id='prevBtn'>‹</button><strong id='monthTitle'></strong><button id='nextBtn'>›</button></div><div class='week'><span>Dl</span><span>Dt</span><span>Dc</span><span>Dj</span><span>Dv</span><span>Ds</span><span>Dg</span></div><div id='days' class='days'></div></div></section><section><div class='title'><h2>Per fer</h2><button id='addInline'>Afegir</button></div><div id='taskList'></div></section><section class='grid'><article class='card'><h3>Assignatures</h3><p id='subjectCount'>0 creades</p><button id='addSubject'>Nova</button></article><article class='card'><h3>Hàbits</h3><p id='habitCount'>0 actius</p><button id='addHabit'>Nou</button></article></section><section class='card'><h3>Focus</h3><div id='timer'>25:00</div><div class='row'><button id='startTimer'>Començar</button><button id='resetTimer'>Reiniciar</button></div></section><section class='card'><div class='title'><h3>Notes ràpides</h3><button id='addNote'>Nova</button></div><div id='notes'></div></section><section class='card'><h3>Còpia de seguretat</h3><div class='row'><button id='exportBtn'>Exportar</button><label class='fileBtn'>Importar<input id='importInput' type='file' accept='.json'></label></div></section></main><dialog id='taskDialog'><form id='taskForm'><h2>Nova tasca</h2><label>Títol<input id='taskTitle' required></label><label>Data<input id='taskDate' type='date' required></label><label>Assignatura<select id='taskSubject'><option value=''>Cap</option></select></label><label>Prioritat<select id='taskPriority'><option>Normal</option><option>Baixa</option><option>Alta</option><option>Urgent</option></select></label><label>Comentaris<textarea id='taskComments'></textarea></label><div class='row end'><button type='button' id='cancelTask'>Cancel·lar</button><button type='submit'>Guardar</button></div></form></dialog><dialog id='simpleDialog'><form id='simpleForm'><h2 id='simpleTitle'></h2><label>Nom o text<input id='simpleInput' required></label><div class='row end'><button type='button' id='simpleCancel'>Cancel·lar</button><button type='submit'>Guardar</button></div></form></dialog><script src='app.js'></script></body></html>
